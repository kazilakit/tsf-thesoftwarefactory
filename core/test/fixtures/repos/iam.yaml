repo: iam
remote: git@github.com:example-org/blocks-iam.git
baseBranch: dev
checks:
  server:
    cwd: server
    build: dotnet build BlocksIAM.sln
    test: dotnet test BlocksIAM.sln
  client:
    cwd: client
    install: npm ci
    typecheck: npm run type-check
    lint: npm run lint
    test: npm test
  e2e: off
